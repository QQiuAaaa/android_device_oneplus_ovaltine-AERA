name: AERA Recovery for ovaltine - 构建

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/AERA-Recovery
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'AERA 清单分支'
        required: true
        default: 'aera-16.0'
        type: choice
        options:
          - aera-16.0
      DEVICE_TREE:
        description: 'AERA 设备树'
        required: true
        default: 'https://github.com/AERA-Recovery/android_device_oneplus_ovaltine-AERA'
      DEVICE_TREE_BRANCH:
        description: 'AERA 设备树分支'
        required: true
        default: 'aera-16.0'
      DEVICE_PATH:
        description: '输入你的设备路径'
        required: true
        default: 'device/oneplus/ovaltine'
      DEVICE_NAME:
        description: '输入你的设备代号'
        required: true
        default: 'ovaltine'
      BUILD_TARGET:
        description: '选择你的构建目标'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      USE_CCACHE:
        description: '是否使用 ccache 编译'
        type: boolean
        required: true
        default: true
      AERA_MAINTAINER:
        description: '输入维护者名称（继承自 OrangeFox 原始树）'
        required: true
        default: '秋詞'

jobs:
  build:
    name: 构建 AERA Recovery by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: 清理构建空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 安装构建依赖环境
        run: |
          sudo apt install aria2 linux-modules-extra-$(uname -r) zram-tools -y
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh
          cd .. && rm -rf scripts

          sudo apt autoclean >/dev/null || true
          sudo apt autoremove -qy 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/ 2>/dev/null || true

      - name: 最大化磁盘可用空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: '3072'

      - name: 拉取仓库内容
        uses: actions/checkout@main

      - name: 配置 ccache 编译缓存
        uses: hendrikmuhs/ccache-action@v1.2
        if: inputs.USE_CCACHE
        with:
          max-size: "2G"
          create-symlink: true

      - name: 启用并配置 ZRAM
        run: |
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: 同步 AERA Recovery 源码清单
        run: |
          # AERA-Recovery org access requires an SSH key registered with GitHub.
          # Add the deploy key as repository secret AERA_SSH_KEY before running.
          eval "$(ssh-agent -s)"
          echo "${{ secrets.AERA_SSH_KEY }}" | tr -d '\r' | ssh-add - > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true

          mkdir -p ${GITHUB_WORKSPACE}/aera
          cd ${GITHUB_WORKSPACE}/aera
          git config --global user.name "QQiuAaaa"
          git config --global user.email "125430057+QQiuAaaa@users.noreply.github.com"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0
          repo sync -c -j$(nproc)


      - name: 克隆设备树源码
        run: |
          cd ${GITHUB_WORKSPACE}/aera
          git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
          cd ${{ inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 编译 AERA Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/aera
          set +e
          export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
          if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          fi
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          set -e
          # AERA-R1.0 uses the Android 16 (bp2a) build target.
          lunch twrp_${{ inputs.DEVICE_NAME }}-bp2a-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image

      - name: 查看 ccache 命中统计
        run: |
          ccache -sv

      - name: 生成发布元信息
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}/aera

          DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
          if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          fi
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

      - name: 规范化输出文件名
        run: |
          OUT_DIR=${GITHUB_WORKSPACE}/aera/out/target/product/${{ inputs.DEVICE_NAME }}

          for f in "$OUT_DIR"/AERA-R1.0*.img "$OUT_DIR"/AERA-R1.0*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            mv "$f" "$OUT_DIR/${name}-${BUILD_DATE}.${ext}"
          done

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: AERA Recovery R1.0 for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          files: |
            aera/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R1.0*.img
            aera/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R1.0*.zip
          body: |
            ## AERA Recovery R1.0 Build - Unofficial

            Build Branch: ${{ inputs.MANIFEST_BRANCH }}
            Build Target: ${{ inputs.BUILD_TARGET }}
            Device Tree: ${{ inputs.DEVICE_TREE }}
            Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Commit: ${{ env.COMMIT_ID }}
            Maintainer: ${{ inputs.AERA_MAINTAINER }}
            Build Date: ${{ env.BUILD_DATE }}
