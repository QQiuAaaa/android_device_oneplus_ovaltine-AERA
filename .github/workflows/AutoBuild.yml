name: AERA Recovery - 月度自动构建

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# And all Contributors in every repositories I used

on:
  #schedule:
    # UTC 16:00 = 北京时间 每月 1 日 00:00
    #- cron: '0 16 1 * *'
  workflow_dispatch:

jobs:
  build:
    name: 构建 AERA Recovery
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===== 构建参数 =====
      # AERA Recovery R1.0: Android 16 manifest (aera-16.0),
      # lunch twrp_ovaltine-bp2a-eng && mka adbd recoveryimage
      MANIFEST_BRANCH: aera-16.0
      DEVICE_TREE: https://github.com/AERA-Recovery/android_device_oneplus_ovaltine-AERA
      DEVICE_TREE_BRANCH: aera-16.0
      DEVICE_PATH: device/oneplus/ovaltine
      DEVICE_NAME: ovaltine
      BUILD_TARGET: recovery
      USE_CCACHE: true
      # Maintainer: 秋詞 (inherited from the original OrangeFox tree;
      # preserved per AERA contribution policy "Preserve original authorship").
      AERA_MAINTAINER: 秋詞

    steps:

      - name: 🧹 清理构建空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 🧰 安装构建依赖环境
        run: |
          sudo apt install -y aria2 linux-modules-extra-$(uname -r) zram-tools
          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
          cd scripts
          sudo bash setup/android_build_env.sh
          cd ..
          rm -rf scripts
          sudo apt autoclean || true
          sudo apt autoremove -qy || true
          sudo rm -rf /var/cache/apt/archives/* || true

      - name: 💾 最大化磁盘可用空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: '3072'

      - name: 📥 拉取仓库内容
        uses: actions/checkout@main

      - name: ⚙️ 配置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          create-symlink: true

      - name: ⚡ 启用并配置 ZRAM
        run: |
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: 同步 AERA Recovery 源码清单
        run: |
          # AERA-Recovery org access requires an SSH key registered with GitHub.
          # Add the deploy key as repository secret AERA_SSH_KEY before running.
          eval "$(ssh-agent -s)"
          echo "${{ secrets.AERA_SSH_KEY }}" | tr -d '\r' | ssh-add - > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true

          mkdir -p ${GITHUB_WORKSPACE}/aera
          cd ${GITHUB_WORKSPACE}/aera

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          repo init -u git@github.com:AERA-Recovery/android_manifest.git \
            -b ${MANIFEST_BRANCH}
          repo sync -c -j$(nproc)

      - name: 克隆设备树源码
        run: |
          cd ${GITHUB_WORKSPACE}/aera
          git clone ${DEVICE_TREE} -b ${DEVICE_TREE_BRANCH} ${DEVICE_PATH}
          cd ${DEVICE_PATH}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 编译 AERA Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/aera
          set +e
          export FOX_BUILD_DEVICE=${DEVICE_NAME}
          export ALLOW_MISSING_DEPENDENCIES=true
          if [[ "${USE_CCACHE}" == "true" ]]; then
            export USE_CCACHE=1
            export CCACHE_EXEC=/usr/bin/ccache
            sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          fi
          source build/envsetup.sh
          set -e

          # AERA-R1.0 uses the Android 16 (bp2a) build target.
          lunch twrp_${DEVICE_NAME}-bp2a-eng

          make clean
          mka adbd ${BUILD_TARGET}image

      - name: 📊 查看 ccache 命中统计
        run: |
          ccache -sv

      - name: 🏷️ 生成发布元信息
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV

      - name: 📦 规范化输出文件名
        run: |
          echo "Searching AERA-R1.0 artifacts..."
          # 只在编译out目录查找，不再全局搜索！
          ARTIFACT_ROOT="${GITHUB_WORKSPACE}/aera/out/target/product/${{ env.DEVICE_NAME }}"
          mapfile -t FILES < <(
            find "${ARTIFACT_ROOT}" \
              -type f \( -name 'AERA-R1.0*.img' -o -name 'AERA-R1.0*.zip' \)
          )

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "ERROR: No AERA-R1.0 artifacts found in ${ARTIFACT_ROOT}"
            exit 1
          fi

          for f in "${FILES[@]}"; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            mv "$f" "$dir/${name}-${BUILD_DATE}.${ext}"
          done

      - name: 🚀 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monthly-${{ env.BUILD_DATE }}
          name: AERA Recovery R1.0 for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          # 直接匹配带日期后缀的文件
          files: |
            aera/out/target/product/${{ env.DEVICE_NAME }}/**/AERA-R1.0*.img
            aera/out/target/product/${{ env.DEVICE_NAME }}/**/AERA-R1.0*.zip
          body: |
            ## AERA Recovery R1.0 Build (Automated)

            - Branch: ${{ env.MANIFEST_BRANCH }}
            - Device: ${{ env.DEVICE_NAME }}
            - Target: ${{ env.BUILD_TARGET }}
            - Device Tree: ${{ env.DEVICE_TREE }}
            - Commit: ${{ env.COMMIT_ID }}
            - Maintainer: ${{ env.AERA_MAINTAINER }}
            - Build Date: ${{ env.BUILD_DATE }}
